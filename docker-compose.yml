version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb_user
      POSTGRES_PASSWORD: kb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_user -d kb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kb-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KB_DB_HOST: postgres
      KB_DB_PORT: 5432
      KB_DB_NAME: kb
      KB_DB_USER: kb_user
      KB_DB_PASSWORD: kb_password
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage


volumes:
  postgres_data: